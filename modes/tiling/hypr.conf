# MonARCH — tiling mode
#
# Sourced last by hyprland.conf, after looknfeel.conf, windows.conf and
# bindings.conf. Anything set here overrides the base.
#
# ─────────────────────────────────────────────── why this file is empty ─────
#
# It is empty on purpose, and that is the whole argument for the overlay
# design.
#
# The base configuration IS tiling mode. looknfeel.conf already has the
# dwindle layout, the gaps, the blur and the animations; windows.conf already
# has the float rules for dialogs. Restating any of it here would create a
# second copy to keep in step, and second copies drift.
#
# Nor does anything need un-setting. `hyprctl reload` re-parses the entire
# configuration from defaults rather than layering onto what is already
# running, so a setting that performance mode turned off comes back the moment
# mode.conf stops pointing at performance mode — because looknfeel.conf is read
# again and says so. Window rules are cleared and rebuilt on reload for the
# same reason.
#
# That is why there is no "undo" step in monarch-mode-set, and why switching
# modes is only ever changing which file gets sourced.
#
# If you find yourself wanting to add something here, ask whether it belongs in
# looknfeel.conf instead — if every mode wants it, it is not a mode setting.

# Nothing. See above.
