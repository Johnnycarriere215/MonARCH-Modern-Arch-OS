# MonARCH — windows mode
#
# Sourced last by hyprland.conf, so everything here overrides the base.
#
# The aim is a desktop that behaves the way someone arriving from Windows 11
# expects: windows float where you put them, every one has a title bar with a
# close button, minimised windows go somewhere you can click them back from.
#
# Colours are theme variables — $accent, $bg, $fg — defined in
# ~/.config/monarch/theme/hypr-colors.conf. Not one hex value belongs in here.

# ═══════════════════════════════════════════════════════════════ floating ═══
#
# Float everything. Hyprland has no global "floating by default", so this is a
# rule matching every class. Rules are cleared and rebuilt on reload, so
# leaving this mode simply stops applying it — there is nothing to undo.
#
# suppressevent maximize stops apps that ask to be maximised on launch from
# fighting the floating layout.
windowrulev2 = float, class:^(.*)$
windowrulev2 = suppressevent maximize, class:^(.*)$

# A floating window with no size hint opens tiny. Give new windows something
# usable and put them in the middle.
windowrulev2 = size 1100 700, floating:1, class:^(Alacritty|code|Code|chromium|Chromium)$
windowrulev2 = center, floating:1

# ═══════════════════════════════════════════════════════════════ hyprbars ═══
#
# Title bars with the three buttons in the order Windows puts them: minimise,
# maximise, close, right to left from the edge.
#
# If the plugin did not load, this block is inert — Hyprland keeps unknown
# plugin configuration rather than erroring on it. That is exactly why
# monarch-mode-set verifies the plugin actually loaded and falls back to tiling
# if it did not: an inert block here means floating windows with no title bars
# and no explanation, which is the worst of both modes.

plugin {
  hyprbars {
    bar_height = 28
    bar_padding = 10
    bar_button_padding = 8
    bar_precedence_over_border = true

    bar_color = $surface
    col.text = $fg

    bar_text_font = JetBrainsMono Nerd Font
    bar_text_size = 11
    bar_text_align = left

    # Buttons are declared right-to-left from the window's right edge:
    #   size, colour, on-click
    #
    # Close is red because it is the one that loses work. The other two are
    # deliberately the same muted colour as everything else — a maximise button
    # that draws the eye is a maximise button you press by accident.
    hyprbars-button = $red, 14, , hyprctl dispatch killactive
    hyprbars-button = $fg_dim, 14, , hyprctl dispatch fullscreen 1
    hyprbars-button = $fg_dim, 14, , hyprctl dispatch movetoworkspacesilent special:minimized
  }
}

# ═══════════════════════════════════════════════════════════════ minimize ═══
#
# There is no minimise in a tiling compositor, so this is one: move the window
# to a special workspace nobody looks at. Waybar's wlr/taskbar lists it and
# clicking the entry brings it back, which is the Windows behaviour people
# actually mean when they say "minimise".
#
# silent = do not follow the window there.
bind = SUPER, M, movetoworkspacesilent, special:minimized

# Toggle the minimised pile into view, for when the taskbar is not enough.
bind = SUPER SHIFT, M, togglespecialworkspace, minimized

# Alt+Tab and Alt+F4, because that is what the muscle memory reaches for.
bind = ALT, Tab, cyclenext
bind = ALT, Tab, bringactivetotop
bind = ALT, F4, killactive

# ══════════════════════════════════════════════════════════════════ chrome ═══
#
# hyprbars draws the border now. A Hyprland border on top of a title bar is one
# frame too many, and the gaps that make tiling readable just waste space when
# nothing is tiled.

general {
  border_size = 1
  gaps_in  = 0
  gaps_out = 4
}

decoration {
  # Square-ish corners under a title bar. A 10px radius with a flat bar on top
  # leaves two odd little wedges at the shoulders.
  rounding = 6

  # Every window opaque: overlapping floating windows with transparency turn
  # into an unreadable stack very quickly.
  active_opacity = 1.0
  inactive_opacity = 1.0
}

# Focus follows the click, not the pointer — moving the mouse across a stack of
# floating windows should not steal focus from what you are typing into.
input {
  follow_mouse = 2
}

misc {
  # Drop a window onto another and it groups. In a floating layout that is the
  # closest thing to a tabbed window, and it is genuinely useful here in a way
  # it is not when everything tiles.
  focus_on_activate = true
}
