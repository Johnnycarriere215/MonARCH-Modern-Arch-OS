# MonARCH — performance mode
#
# Sourced last by hyprland.conf, so everything here overrides the base.
#
# Deltas only. The layout, the keys and the window rules are tiling mode's and
# are deliberately untouched — switching to this mode should change how the
# desktop LOOKS and nothing about how it works, so it can be switched on
# mid-task without anything moving under you.

decoration {
  # The expensive one. On UHD 620 blur is most of the compositor's GPU time,
  # and two passes over a 1920x1080 surface is real work every frame something
  # moves in front of it.
  blur {
    enabled = false
  }

  # Shadows cost an extra pass per window edge. Cheaper than blur, not free.
  shadow {
    enabled = false
  }

  # Square corners: rounding forces the window through a shader that a
  # rectangle can skip entirely.
  rounding = 0

  # Opaque everything. Transparency means the compositor has to draw what is
  # behind a window as well as the window.
  active_opacity = 1.0
  inactive_opacity = 1.0
  fullscreen_opacity = 1.0
}

animations {
  # The smallest real saving here, and the biggest change in feel. A machine
  # that is struggling reads as faster with instant window switching, even
  # though the frames saved are few.
  enabled = false
}

general {
  # Thinner border, smaller gaps: more usable pixels on a 15" panel, and less
  # area to redraw.
  gaps_in     = 2
  gaps_out    = 6
  border_size = 1

  # A gradient border is two colours interpolated every frame the border
  # animates. Flat costs nothing.
  col.active_border   = $accent
  col.inactive_border = $inactive_a
}

misc {
  # Do not render a wallpaper behind fullscreen windows — nothing can see it,
  # and on Intel this is the difference between direct scanout and a composite
  # pass.
  vfr = true
  vrr = 0
}

# Do not animate the groupbar either; it redraws on every focus change.
group {
  groupbar {
    gradients = false
  }
}
