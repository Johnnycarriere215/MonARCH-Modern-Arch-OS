#!monarch-template
#!target: monarch/theme/hypr-colors.conf
#!reload: hyprctl reload
#!
#! Hyprlock is themed by this same file: it speaks Hyprland's config language
#! and config/hypr/hyprlock.conf sources this path directly. One template
#! covers both, which is why there is no hyprlock template beside this one.
# GENERATED BY MONARCH — DO NOT EDIT
#
# Theme: {{meta.name}} by {{meta.author}}
# Regenerate with: monarch theme apply <name>
#
# Every colour in MonARCH's Hyprland and Hyprlock configuration resolves
# through this file. Nothing downstream hardcodes a hex value, so swapping
# themes is a matter of rewriting this one file and reloading.
#
# Seed-only: monarch-config-apply installs it when missing and never
# overwrites it, so an applied theme survives an update.

# ------------------------------------------------------------------ surfaces
$bg          = {{ui.bg|rgb}}
$bg_alt      = {{ui.bg_alt|rgb}}
$surface     = {{ui.surface|rgb}}
$overlay     = {{ui.overlay|rgb}}

# --------------------------------------------------------------------- text
$fg          = {{ui.fg|rgb}}
$fg_dim      = {{ui.fg_dim|rgb}}
$fg_faint    = {{ui.fg_faint|rgb}}

# ------------------------------------------------------------------- accents
$accent      = {{ui.accent|rgb}}
$accent_alt  = {{ui.accent_alt|rgb}}

# --------------------------------------------------------------------- state
$red         = {{term.red|rgb}}
$green       = {{term.green|rgb}}
$yellow      = {{term.yellow|rgb}}
$blue        = {{term.blue|rgb}}
$magenta     = {{term.magenta|rgb}}
$cyan        = {{term.cyan|rgb}}

# ------------------------------------------------------------------- meaning
# Prefer these over the raw colours above for anything that reports a state.
$urgent      = {{sem.urgent|rgb}}
$warning     = {{sem.warning|rgb}}
$ok          = {{sem.ok|rgb}}
$info        = {{sem.info|rgb}}
$muted       = {{sem.muted|rgb}}

# ------------------------------------------- alpha variants for borders/blur
# Hyprland gradients need rgba(), and the shadow needs a low-alpha black.
$accent_a     = {{ui.border_active|rgba:ee}}
$accent_alt_a = {{ui.accent_alt|rgba:ee}}
$inactive_a   = {{ui.border_inactive|rgba:aa}}
$shadow_a     = rgba(00000055)
