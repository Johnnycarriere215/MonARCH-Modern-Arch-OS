#!monarch-template
#!target: monarch/theme/alacritty-colors.toml
#!
#! No reload command: alacritty.toml sets live_config_reload = true and this
#! file is imported by it, so the terminal repaints on write.
# GENERATED BY MONARCH — DO NOT EDIT
#
# Theme: {{meta.name}} by {{meta.author}}
# Regenerate with: monarch theme apply <name>
#
# Imported by alacritty.toml, which carries no colours of its own.
# Seed-only: installed when missing, never overwritten by monarch-config-apply.

[colors.primary]
background = "{{term.bg}}"
foreground = "{{term.fg}}"
dim_foreground = "{{ui.fg_dim}}"

[colors.cursor]
text   = "{{term.bg}}"
cursor = "{{ui.cursor}}"

[colors.selection]
text       = "{{ui.selection_fg}}"
background = "{{ui.selection_bg}}"

[colors.normal]
black   = "{{term.black}}"
red     = "{{term.red}}"
green   = "{{term.green}}"
yellow  = "{{term.yellow}}"
blue    = "{{term.blue}}"
magenta = "{{term.magenta}}"
cyan    = "{{term.cyan}}"
white   = "{{term.white}}"

[colors.bright]
black   = "{{term.bright_black}}"
red     = "{{term.bright_red}}"
green   = "{{term.bright_green}}"
yellow  = "{{term.bright_yellow}}"
blue    = "{{term.bright_blue}}"
magenta = "{{term.bright_magenta}}"
cyan    = "{{term.bright_cyan}}"
white   = "{{term.bright_white}}"
