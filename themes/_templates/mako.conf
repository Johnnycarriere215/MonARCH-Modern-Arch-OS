#!monarch-template
#!target: mako/config
#!reload: makoctl reload
#!
#! Mako has no include directive — there is no way to hand it a colours-only
#! file the way Hyprland and Waybar accept one. So the theme owns the whole
#! config. That is why layout keys (width, margin, font) appear in a theme
#! template: they have nowhere else to live. Nothing else in MonARCH writes
#! mako/config, so there is no file to conflict with.
# GENERATED BY MONARCH — DO NOT EDIT
#
# Theme: {{meta.name}} by {{meta.author}}
# Regenerate with: monarch theme apply <name>

font=JetBrainsMono Nerd Font 11
width=380
height=140
margin=12
padding=14
border-size=2
border-radius=10
icon-path=/usr/share/icons/Adwaita
max-icon-size=48
default-timeout=6000
ignore-timeout=1
layer=overlay
anchor=top-right

background-color={{ui.bg_alt|hexa:f2}}
text-color={{ui.fg}}
border-color={{ui.overlay}}
progress-color=over {{ui.accent|hexa:40}}

[urgency=low]
border-color={{sem.muted}}
text-color={{ui.fg_dim}}
default-timeout=4000

[urgency=normal]
border-color={{ui.accent}}

# Critical notifications do not time out. A disk filling up should still be on
# screen when you come back to the desk.
[urgency=critical]
border-color={{sem.urgent}}
text-color={{ui.fg}}
default-timeout=0

# The lock screen is not the place to render the contents of your messages.
[mode=lock]
invisible=1
