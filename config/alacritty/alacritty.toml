# MonARCH — Alacritty
#
# No colours in this file. They come from the import below, which
# `monarch theme apply` rewrites.

[general]
# Alacritty 0.14 moved `import` under [general]. On 0.13 and earlier this key
# lives at the top level instead — if the terminal starts with default colours
# after an upgrade, this is the first thing to check.
import = ["~/.config/monarch/theme/alacritty-colors.toml"]
live_config_reload = true

[env]
TERM = "alacritty"

[window]
padding = { x = 12, y = 10 }
dynamic_padding = true
decorations = "None"
opacity = 1.0
dynamic_title = true

# Hyprland matches on this. Changing it breaks the window rules in
# windows.conf and the dropdown terminal in monarch.conf.
class = { instance = "Alacritty", general = "Alacritty" }

[font]
size = 11.0
normal      = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold        = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic      = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }

# Tightens the default line spacing slightly. JetBrainsMono is generous here
# and a full screen of code reads better pulled in a little.
offset = { x = 0, y = -1 }

[scrolling]
# 10k lines. Enough to scroll back through a build log without turning the
# terminal into a memory sink.
history = 10000
multiplier = 3

[cursor]
style = { shape = "Block", blinking = "Off" }
unfocused_hollow = true
thickness = 0.15

[selection]
save_to_clipboard = false
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[mouse]
hide_when_typing = true

[terminal]
osc52 = "CopyPaste"

[keyboard]
bindings = [
  # Ctrl+Shift+C/V, because Ctrl+C is busy doing its real job.
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },

  { key = "Plus",  mods = "Control", action = "IncreaseFontSize" },
  { key = "Minus", mods = "Control", action = "DecreaseFontSize" },
  { key = "Key0",  mods = "Control", action = "ResetFontSize" },

  { key = "F", mods = "Control|Shift", action = "SearchForward" },
  { key = "B", mods = "Control|Shift", action = "SearchBackward" },
]
