#? Config file for btop v. 1.4

# MonARCH ships this for one reason: to pin color_theme at "monarch", so that
# `monarch theme apply` only ever has to rewrite the theme file's CONTENTS and
# never has to touch btop's config. The theme name is a constant; the palette
# inside it changes.
#
# Seed-only. btop rewrites this file itself on exit, filling in every key it
# did not find — which is why a partial file like this one is fine, and also
# why MonARCH must never try to update it.

color_theme = "monarch"

# Presets, in the order the Waybar modules reference them. Clicking a stat in
# the bar opens btop showing only that resource:
#
#   0  cpu     <- #cpu
#   1  mem     <- #memory and #disk (btop draws disks inside the mem box)
#   2  net     <- #network.throughput
#   3  proc
#
# The indices here and the `btop -p N` calls in
# config/waybar/modules-system.jsonc must agree. Change one, change the other.
presets = "cpu:0:default,mem:0:default,net:0:default,proc:0:default"
theme_background = False
vim_keys = True
update_ms = 2000
proc_sorting = "cpu lazy"
proc_tree = False
show_battery = True
