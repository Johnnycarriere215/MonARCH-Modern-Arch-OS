# MonARCH — lock screen
#
# Not in the T2 spec, but hypridle locks the session and a missing hyprlock
# config gives you a black screen with no password field, which is
# indistinguishable from a hang.
#
# Colours come from the theme, same as everything else. T3 restyles this.

source = ~/.config/monarch/theme/hypr-colors.conf

general {
  hide_cursor = true
  grace = 2
  no_fade_in = false
  disable_loading_bar = true
}

background {
  monitor =
  color = $bg
  blur_passes = 2
  blur_size = 6
}

input-field {
  monitor =
  size = 320, 48
  position = 0, -60
  halign = center
  valign = center

  outline_thickness = 2
  rounding = 10
  dots_center = true
  dots_size = 0.25
  dots_spacing = 0.3

  outer_color  = $accent
  inner_color  = $surface
  font_color   = $fg
  check_color  = $accent_alt
  fail_color   = $red

  # Plain text, no Pango colour spans. Pango wants a ##RRGGBB literal and the
  # theme speaks rgb(), so any colour here would be one the theme engine could
  # never reach. font_color and fail_color above already carry the palette.
  placeholder_text = Password
  fail_text = Wrong

  fade_on_empty = false
}

# Time.
label {
  monitor =
  text = cmd[update:1000] date +"%H:%M"
  color = $fg
  font_size = 88
  font_family = JetBrainsMono Nerd Font
  position = 0, 140
  halign = center
  valign = center
}

# Date.
label {
  monitor =
  text = cmd[update:60000] date +"%A, %e %B"
  color = $fg_dim
  font_size = 18
  font_family = JetBrainsMono Nerd Font
  position = 0, 70
  halign = center
  valign = center
}

# Who is logged in. Useful on a shared machine, harmless on a personal one.
label {
  monitor =
  text = $USER
  color = $fg_faint
  font_size = 14
  font_family = JetBrainsMono Nerd Font
  position = 0, -120
  halign = center
  valign = center
}
