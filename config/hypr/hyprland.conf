# MonARCH — Hyprland entry point
#
# This file does nothing but set the load order. Every actual setting lives in
# one of the sourced files, so there is exactly one place to look for any given
# thing and no file grows past a screenful.
#
# Written for MonARCH. Not copied from another distribution.
#
# Load order matters:
#   theme colours first  — everything below refers to $accent, $bg, and friends,
#                          and Hyprland resolves variables at parse time, so a
#                          colour used before it is defined is a silent black.
#   bindings and autostart last — they reference workspaces and window rules
#                          defined above them.

# ---------------------------------------------------------------- the theme --
# Rewritten by `monarch theme apply`. Never edited by hand.
source = ~/.config/monarch/theme/hypr-colors.conf

# ------------------------------------------------------------- the MonARCH  --
# Environment, workspaces, dropdown terminal, Intel defaults.
source = ~/.config/hypr/monarch.conf

# --------------------------------------------------------------- the machine --
# Displays. Yours to edit, or let `nwg-displays` write it.
source = ~/.config/hypr/monitors.conf

# ------------------------------------------------------------------ the feel --
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/windows.conf

# ------------------------------------------------------------------ the keys --
# Placeholder until T4. `monarch keys apply` regenerates it from
# schema/keybinds.toml and stamps it as generated.
source = ~/.config/hypr/bindings.conf

# ----------------------------------------------------------------- the start --
source = ~/.config/hypr/autostart.conf
