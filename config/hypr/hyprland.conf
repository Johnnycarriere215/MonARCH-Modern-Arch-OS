# MonARCH — Hyprland entry point
#
# This file does nothing but set the load order. Every actual setting lives in
# one of the sourced files, so there is exactly one place to look for any given
# thing and no file grows past a screenful.
#
# Written for MonARCH. Not copied from another distribution.
#
# Load order matters:
#   theme colours first  — everything below refers to $accent, $bg, and friends,
#                          and Hyprland resolves variables at parse time, so a
#                          colour used before it is defined is a silent black.
#   bindings and autostart last — they reference workspaces and window rules
#                          defined above them.

# ---------------------------------------------------------------- the theme --
# Rewritten by `monarch theme apply`. Never edited by hand.
source = ~/.config/monarch/theme/hypr-colors.conf

# ------------------------------------------------------------- the MonARCH  --
# Environment, workspaces, dropdown terminal, Intel defaults.
source = ~/.config/hypr/monarch.conf

# --------------------------------------------------------------- the machine --
# Displays. Yours to edit, or let `nwg-displays` write it.
source = ~/.config/hypr/monitors.conf

# ------------------------------------------------------------------ the feel --
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/windows.conf

# ------------------------------------------------------------------ the keys --
# Generated by `monarch keys apply` from schema/keybinds.toml. Stamped DO NOT
# EDIT, and regenerated whole — change the keymap, not this file.
source = ~/.config/hypr/bindings.conf

# ------------------------------------------------------------------ the mode --
# LAST, and that is the entire mode system. Hyprland lets a later assignment
# override an earlier one, so a mode fragment only has to state its deltas and
# switching modes is only changing which file these two point at.
#
# Both are generated. mode.conf is the saved mode (`monarch mode set`);
# mode-session.conf is a mode for this session only (`monarch mode session`)
# and is emptied at the next login by `monarch mode session-end`, which
# autostart.conf runs.
#
# Nothing needs undoing when a mode is left: `hyprctl reload` re-parses the
# whole configuration from defaults, so the settings above simply reassert
# themselves.
source = ~/.config/hypr/mode.conf
source = ~/.config/hypr/mode-session.conf

# ----------------------------------------------------------------- the start --
source = ~/.config/hypr/autostart.conf
