# MonARCH — what starts with the session
#
# ESSENTIALS ONLY. The desktop does not work without these, so this file
# belongs to MonARCH and updates land in it.
#
# Your own startup apps go in autostart-user.conf, sourced at the bottom.
# They are deliberately in a separate file: if your apps lived here, this file
# would count as user-edited and you would stop receiving fixes to the
# essentials below.

# ═════════════════════════════════════════════════════════════ essentials ═══

# Hand the session environment to dbus and systemd --user. Without this,
# screen sharing, file pickers and notifications from systemd services all fail
# in ways that look unrelated to each other.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Clear a session-only mode left over from last time. It has to run from
# inside the session, which is necessarily after Hyprland has already parsed
# the overlay — so last night's temporary mode is on screen for about a second
# this morning, then this puts it back. Silent and reload-free when there is
# nothing to clear, which is every normal login.
exec-once = monarch-mode-session-end

# Authentication prompts. Nothing that needs a password works without an agent.
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# The bar and notifications.
exec-once = waybar
exec-once = mako

# Idle -> lock -> screen off. Config in hypridle.conf.
exec-once = hypridle

# Wallpaper. hyprpaper.conf is generated by `monarch background set`, which
# also swaps the image live over hyprpaper's IPC rather than restarting it.
# `monarch theme apply` sets the active theme's first wallpaper, so a fresh
# install lands on one; with none set, hyprpaper runs empty and the desktop
# shows Hyprland's own background.
exec-once = hyprpaper

# Clipboard history, shown by SUPER+X through walker. Two watchers: text and
# images are separate selections as far as Wayland is concerned.
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Walker in service mode. Starting it here costs a few MB and takes the
# launcher from ~200ms to instant, which is the difference between a launcher
# you use and one you avoid.
exec-once = walker --gapplication-service

# hyprpm plugins — hyprbars, which windows mode needs. Plugins are compiled
# against one Hyprland version and do not survive an update; `monarch mode set`
# rebuilds them and falls back to tiling if they still will not load.
exec-once = hyprpm reload -n

# ══════════════════════════════════════════════════════════ your apps ═══

source = ~/.config/hypr/autostart-user.conf
