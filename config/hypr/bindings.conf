# MonARCH — keybindings
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │  PLACEHOLDER. This file is hand-written and will be REPLACED in T4.       │
# │                                                                          │
# │  From T4 onward, schema/keybinds.toml is the source of truth and          │
# │  `monarch keys apply` generates this file with a GENERATED header.        │
# │  Edits made here now will be lost then — which is fine, they get          │
# │  transcribed into keybinds.toml as part of that task.                     │
# │                                                                          │
# │  It exists today because T2's bar is "the VM boots, logs in, and opens    │
# │  a terminal", and that needs a working key to open one with.              │
# └──────────────────────────────────────────────────────────────────────────┘

$mod = SUPER
$term = alacritty
$browser = chromium
$files = nautilus

# ══════════════════════════════════════════════════════════════ launcher ═══
#
# Locked decision: a bare Super tap opens Walker.
#
# bindr fires on RELEASE, which is what makes this work — Super can still be
# held as a modifier for every binding below, and only a press-and-release with
# nothing in between reaches the launcher.
bindr = $mod, SUPER_L, exec, walker

# ═══════════════════════════════════════════════════════════════ launch ═══

bind = $mod, Return, exec, $term
bind = $mod, B, exec, $browser
bind = $mod, E, exec, $files
bind = $mod SHIFT, Return, exec, $term --class monarch-float

# Dropdown terminal. The workspace and its window rules are in monarch.conf.
bind = $mod, grave, togglespecialworkspace, dropdown

# ═══════════════════════════════════════════════════════════════ window ═══

bind = $mod, Q, killactive,
bind = $mod, V, togglefloating,
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, F, fullscreen, 1
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,

# Focus. Arrows and hjkl both, because muscle memory differs by mood.
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, H,     movefocus, l
bind = $mod, L,     movefocus, r
bind = $mod, K,     movefocus, u

# Move the window itself.
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Resize, held.
binde = $mod CTRL, left,  resizeactive, -40 0
binde = $mod CTRL, right, resizeactive, 40 0
binde = $mod CTRL, up,    resizeactive, 0 -40
binde = $mod CTRL, down,  resizeactive, 0 40

# Mouse.
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# ═══════════════════════════════════════════════════════════ workspaces ═══
#
# 1-5 are persistent (see monarch.conf). 6 is created by this binding and
# destroyed by Hyprland when its last window closes.

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6

bind = $mod, Tab, workspace, e+1
bind = $mod SHIFT, Tab, workspace, e-1
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# ═══════════════════════════════════════════════════════════════ system ═══

bind = $mod, Escape, exec, hyprlock
bind = $mod SHIFT, E, exit,
bind = $mod SHIFT, R, exec, hyprctl reload

# Screenshots. grim writes the file, slurp picks the region.
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy
bind = $mod, Print, exec, grim -g "$(slurp)" "$HOME/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png"

# ════════════════════════════════════════════════════════════════ media ═══

bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindl = , XF86AudioPlay,  exec, playerctl play-pause
bindl = , XF86AudioNext,  exec, playerctl next
bindl = , XF86AudioPrev,  exec, playerctl previous

bindel = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Lid close / power button are handled by systemd-logind, not here.

# ══════════════════════════════════════════════════════════════════ help ═══
#
# Enabled in T4, once `monarch keys list` exists to be shown. Leaving it bound
# to a missing command now would give you a key that silently does nothing.
#
# bind = $mod, slash, exec, monarch keys list
