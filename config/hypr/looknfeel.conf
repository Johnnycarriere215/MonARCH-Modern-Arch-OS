# MonARCH — the look
#
# Rounded corners, restrained animation, subtle blur, real gaps.
#
# Not one hex value in this file. Every colour is a variable defined in
# ~/.config/monarch/theme/hypr-colors.conf, which `monarch theme apply`
# rewrites. If you find yourself typing rgb( in here, the theme system is being
# worked around.
#
# The animation timings are deliberately short. Motion should tell you where a
# window went, then get out of the way. Anything above ~250ms starts to feel
# like waiting rather than like feedback.

general {
  gaps_in     = 5
  gaps_out    = 12
  border_size = 2

  col.active_border   = $accent_a $accent_alt_a 45deg
  col.inactive_border = $inactive_a

  resize_on_border = true
  hover_icon_on_border = true

  layout = dwindle
  allow_tearing = false
}

decoration {
  rounding = 10
  rounding_power = 2.0

  active_opacity   = 1.0
  inactive_opacity = 0.96
  fullscreen_opacity = 1.0

  blur {
    enabled = true

    # Subtle, and cheap. Blur is the most expensive thing a compositor does and
    # UHD 620 has no headroom to spare. size 6 / passes 2 reads as frosted
    # glass; going to passes 3 costs real frames for a difference nobody sees.
    size = 6
    passes = 2

    ignore_opacity = true
    new_optimizations = true
    xray = false

    # Do not blur behind popups and menus — it stacks passes on small surfaces
    # and looks muddy rather than soft.
    popups = false
  }

  shadow {
    enabled = true
    range = 16
    render_power = 2
    color = $shadow_a
  }
}

animations {
  enabled = true

  # Two curves, used everywhere. A house style is more valuable than a
  # different easing on every element.
  #
  #   snap  — overshoots very slightly, for things appearing
  #   ease  — no overshoot, for things moving or leaving
  bezier = snap, 0.05, 0.9, 0.1, 1.05
  bezier = ease, 0.25, 0.1, 0.25, 1.0

  animation = windows,     1, 4, snap, slide
  animation = windowsOut,  1, 4, ease, slide
  animation = windowsMove, 1, 4, ease

  animation = fade,        1, 5, ease
  animation = fadeDim,     1, 5, ease

  animation = border,      1, 8, ease
  animation = borderangle, 1, 30, ease

  # Workspace switches are the animation you see most often in a day. Keep it
  # brisk — this is the one that decides whether the desktop feels fast.
  animation = workspaces,  1, 4, snap, slidefade 15%
  animation = specialWorkspace, 1, 4, snap, slidevert

  animation = layers,      1, 3, ease, slide
}

dwindle {
  pseudotile = true
  preserve_split = true

  # Split along the longer edge. On a 16:9 panel this means the first split is
  # vertical, which is what you want for two side-by-side editors.
  smart_split = false
  force_split = 2

  default_split_ratio = 1.0
}

master {
  new_status = master
  new_on_top = false
  mfact = 0.55
}

group {
  col.border_active   = $accent_a
  col.border_inactive = $inactive_a

  groupbar {
    enabled = true
    font_family = JetBrainsMono Nerd Font
    font_size = 11
    height = 16
    gradients = false

    text_color        = $fg
    col.active        = $accent
    col.inactive      = $surface
  }
}
