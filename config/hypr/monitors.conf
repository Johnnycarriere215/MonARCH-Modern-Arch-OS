# MonARCH — displays
#
# This file is YOURS. MonARCH installs it once and never touches it again, so
# your monitor arrangement survives every update. `nwg-displays` writes here
# too, and the Monitors panel in the settings GUI will drive that.
#
# Syntax:  monitor = <name>, <resolution>@<rate>, <position>, <scale>
# Names:   run `hyprctl monitors` to see what your hardware calls itself.

# The EliteBook's internal panel. 1080p, so scale 1 — see GDK_SCALE in
# monarch.conf, which has to agree with this.
monitor = eDP-1, 1920x1080@60, 0x0, 1

# Anything plugged in later: use its preferred mode, place it to the right of
# whatever is already there, no scaling. Covers the Thunderbolt dock case
# without needing to know the monitor in advance.
monitor = , preferred, auto, 1

# Examples, for when you want something specific:
#
#   monitor = DP-1, 2560x1440@144, 1920x0, 1        # to the right of eDP-1
#   monitor = HDMI-A-1, 1920x1080@60, 0x-1080, 1    # above eDP-1
#   monitor = eDP-1, disable                         # lid closed, dock only
