# MonARCH — your startup apps
#
# This file is YOURS. MonARCH seeds it once and never overwrites it.
#
# Managed by:
#   monarch startup list
#   monarch startup add "signal-desktop --start-in-tray"
#   monarch startup remove "signal-desktop --start-in-tray"
#
# ...and by the Startup Apps panel in the settings GUI, which shells out to
# exactly those commands.
#
# Everything between the two markers is rewritten by the CLI. Hand-editing in
# there is fine — it is read back, not just overwritten — but the marker lines
# themselves must stay exactly as they are.
#
# The essentials (bar, notifications, idle daemon, polkit agent) are in
# autostart.conf and are not listed here.

# >>> monarch startup apps >>>
# <<< monarch startup apps <<<
