# MonARCH — input
#
# Keyboard, pointer, touchpad, gestures.

input {
  kb_layout  = us
  kb_variant =
  kb_model   =
  kb_rules   =

  # Caps Lock is in the best position on the keyboard and does the least useful
  # job. Uncomment to make it Escape:
  # kb_options = caps:escape

  follow_mouse = 1
  mouse_refocus = false

  # Pointer acceleration off. Flat means the same physical movement always
  # produces the same cursor movement, which matters more than it sounds like
  # once you are used to it.
  accel_profile = flat
  sensitivity = 0

  numlock_by_default = true

  touchpad {
    natural_scroll = true
    disable_while_typing = true
    tap-to-click = true
    tap-and-drag = true
    drag_lock = true
    scroll_factor = 0.8
    clickfinger_behavior = true
  }
}

gestures {
  # Three fingers left/right to change workspace. The one gesture worth having;
  # the rest get in the way more than they help.
  workspace_swipe = true
  workspace_swipe_fingers = 3
  workspace_swipe_distance = 400
  workspace_swipe_cancel_ratio = 0.4
  workspace_swipe_min_speed_to_force = 20

  # Do not swipe onto an empty workspace past the last one — it is almost
  # always an overshoot rather than an intention.
  workspace_swipe_create_new = false
}

# Per-device overrides go here. `hyprctl devices` lists the names.
#
# device {
#   name = elan-touchpad
#   sensitivity = 0.2
# }
