# MonARCH — idle behaviour
#
# Not in the T2 spec, but autostart.conf launches hypridle and hypridle with no
# config exits immediately. Shipping it here keeps the session honest.
#
# The ladder: dim at 5 minutes, lock at 10, screen off at 12, suspend at 30.
# Dimming first is deliberate — it is the warning that a lock is coming, and it
# is reversible by moving the mouse.

general {
  lock_cmd = pidof hyprlock || hyprlock
  before_sleep_cmd = loginctl lock-session
  after_sleep_cmd = hyprctl dispatch dpms on
  ignore_dbus_inhibit = false
}

listener {
  timeout = 300
  on-timeout = brightnessctl -s set 10
  on-resume  = brightnessctl -r
}

listener {
  timeout = 600
  on-timeout = loginctl lock-session
}

listener {
  timeout = 720
  on-timeout = hyprctl dispatch dpms off
  on-resume  = hyprctl dispatch dpms on
}

listener {
  timeout = 1800
  on-timeout = systemctl suspend
}
