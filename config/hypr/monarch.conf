# MonARCH — the MonARCH layer
#
# Environment, workspaces, the dropdown terminal, and Intel graphics defaults.
# This is the file that makes a Hyprland install a MonARCH install.

# ═══════════════════════════════════════════════════════════ environment ═══

# Locked decision: the target panel is a 1920x1080 15" eDP-1, not a retina
# display. GDK_SCALE=2 makes everything comically large here. Do not "fix" this
# without testing on the actual EliteBook.
env = GDK_SCALE,1
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Toolkits -> Wayland. Without these, GTK and Qt apps fall back to XWayland and
# render blurry on any fractional scale.
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1

# Electron apps (VS Code, Claude Desktop) need to be told, or they run under
# XWayland with a blank titlebar and broken fractional scaling.
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Locked decision: Claude Desktop needs this to use Wayland. It also needs
# /dev/kvm — monarch-doctor reports on it, and the T8 installer warns.
env = CLAUDE_USE_WAYLAND,1

# Portal / session identification.
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# ════════════════════════════════════════════════════════ Intel graphics ═══
#
# Hardware target is Intel UHD 620 (Whiskey Lake) and nothing else. No NVIDIA,
# no hybrid graphics, so none of the usual dual-GPU workarounds apply here.

# iHD is the modern VA-API driver for Gen8+. The old i965 driver would also
# load and would silently cost you hardware video decode.
env = LIBVA_DRIVER_NAME,iHD
env = VDPAU_DRIVER,va_gl

render {
  # Intel handles direct scanout well; leaving this on saves a composite pass
  # on fullscreen video and games.
  direct_scanout = true
}

cursor {
  # Intel's hardware cursor planes are reliable. This stays on — turning it off
  # is an NVIDIA workaround and costs latency for nothing here.
  no_hardware_cursors = false
}

# ════════════════════════════════════════════════════════════ workspaces ═══
#
# Locked decision: 5 by default, a 6th on demand.
#
# 1-5 are persistent — they exist whether or not anything is on them, so the
# bar shows a stable row and Super+3 always goes somewhere.
#
# 6 is deliberately NOT persistent. Super+6 brings it into existence, and
# Hyprland destroys it the moment its last window closes. That is the whole
# mechanism; there is no script involved.

workspace = 1, persistent:true, default:true
workspace = 2, persistent:true
workspace = 3, persistent:true
workspace = 4, persistent:true
workspace = 5, persistent:true

# ═════════════════════════════════════════════════════ dropdown terminal ═══
#
# Locked decision: a native special workspace, not pyprland. Hyprland does this
# itself, so per golden rule 3 we do not add a daemon to get it.
#
# on-created-empty spawns the terminal the first time the workspace is summoned
# and never again — toggling afterwards shows and hides the same instance.

workspace = special:dropdown, on-created-empty:alacritty --class monarch-dropdown

windowrulev2 = float,           class:^(monarch-dropdown)$
windowrulev2 = size 80% 55%,    class:^(monarch-dropdown)$
windowrulev2 = move 10% 2%,     class:^(monarch-dropdown)$
windowrulev2 = animation slide, class:^(monarch-dropdown)$

# ══════════════════════════════════════════════════════════════════ misc ═══

misc {
  # No wallpaper-less grey and no Hyprland logo on an empty workspace.
  disable_hyprland_logo = true
  disable_splash_rendering = true

  # Variable refresh: stop redrawing when nothing moves. On a laptop this is
  # the single biggest idle-battery win available in this file.
  vfr = true

  # 0 = never drop to a lower refresh rate mid-interaction. On a 60Hz panel
  # there is nothing to gain from vrr and some compositing glitches to lose.
  vrr = 0

  focus_on_activate = true
  enable_swallow = false
  new_window_takes_over_fullscreen = 2
}

ecosystem {
  # We ship our own update path (T7). Hyprland's own nag is noise.
  no_update_news = true
  no_donation_nag = true
}
