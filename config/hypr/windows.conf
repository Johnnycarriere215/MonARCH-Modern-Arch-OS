# MonARCH — window rules
#
# Rules for the dropdown terminal live in monarch.conf, next to the workspace
# that defines it. Everything else is here.

# ═══════════════════════════════════════════════════════════════ floating ═══
#
# Dialogs, pickers and one-shot utilities. A tiling compositor that tiles a
# file-save dialog into a 400px column is technically correct and useless.

windowrulev2 = float, class:^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrulev2 = float, class:^(org.gnome.Calculator|gnome-calculator)$
windowrulev2 = float, class:^(nwg-displays)$
windowrulev2 = float, class:^(xdg-desktop-portal-gtk)$
windowrulev2 = float, title:^(Open File|Save File|Save As|Open Folder|Choose Files)(.*)$
windowrulev2 = float, title:^(Picture-in-Picture|Picture in picture)$

# Give the floaters a sane size instead of whatever they ask for.
windowrulev2 = size 900 600,  class:^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrulev2 = center,        class:^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrulev2 = size 1000 700, class:^(nwg-displays)$
windowrulev2 = center,        class:^(nwg-displays)$

# Picture-in-picture: float, keep on top, follow you between workspaces.
windowrulev2 = pin,       title:^(Picture-in-Picture|Picture in picture)$
windowrulev2 = keepaspectratio, title:^(Picture-in-Picture|Picture in picture)$
windowrulev2 = move 100%-30% 100%-30%, title:^(Picture-in-Picture|Picture in picture)$

# ══════════════════════════════════════════════════════════════════ opacity ═══
#
# Terminals and the editor get a touch of transparency; anything showing images
# or video must stay fully opaque or the colours are simply wrong.

windowrulev2 = opacity 0.94 0.90, class:^(Alacritty)$
windowrulev2 = opacity 0.98 0.96, class:^(code|Code|code-oss)$

windowrulev2 = opacity 1.0 1.0, class:^(imv|mpv|Chromium|chromium|google-chrome|firefox)$
windowrulev2 = opacity 1.0 1.0, class:^(gimp|Gimp|org.inkscape.Inkscape)$

# ════════════════════════════════════════════════════════════════ workspace ═══
#
# Deliberately minimal. Pinning apps to workspaces is a personal habit, not a
# default — the settings GUI will manage these rather than this file growing.

windowrulev2 = workspace 2, class:^(Chromium|chromium)$
windowrulev2 = workspace 3, class:^(code|Code)$

# ═══════════════════════════════════════════════════════════════════ misc ═══

# Never let a window steal focus mid-typing.
windowrulev2 = noinitialfocus, class:^(xwaylandvideobridge)$

# Inhibit idle while something is playing fullscreen. Without this the screen
# locks 10 minutes into a film.
windowrulev2 = idleinhibit fullscreen, class:^(.*)$

# Authentication prompts: float, centre, always on top. This one is worth being
# strict about — a polkit dialog tiled behind another window looks like a hang.
windowrulev2 = float,  class:^(polkit-gnome-authentication-agent-1)$
windowrulev2 = center, class:^(polkit-gnome-authentication-agent-1)$
windowrulev2 = pin,    class:^(polkit-gnome-authentication-agent-1)$

# Drag-and-drop shadow windows and tooltips should never be tiled or animated.
windowrulev2 = noanim,   class:^(xwaylandvideobridge)$
windowrulev2 = nofocus,  class:^(xwaylandvideobridge)$
windowrulev2 = noblur,   class:^(xwaylandvideobridge)$

# ═════════════════════════════════════════════════════════════════ layers ═══

# The launcher and notifications sit above everything, blurred, no shadow.
layerrule = blur, walker
layerrule = ignorezero, walker
layerrule = blur, notifications
layerrule = ignorezero, notifications
layerrule = blur, waybar
layerrule = ignorezero, waybar
